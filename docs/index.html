<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="复盘助手">
  <meta name="format-detection" content="telephone=no">
  <title>复盘助手</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">复</div>
        <div>
          <h1>复盘助手</h1>
          <p id="trade-date">正在加载交易数据…</p>
        </div>
      </div>
      <div class="live-dot" id="data-state">在线</div>
    </header>

    <main>
      <section class="summary-grid" aria-label="今日摘要">
        <article class="summary-card accent-red">
          <span>模型命中</span>
          <strong id="model-count">--</strong>
          <small>符合全部条件</small>
        </article>
        <article class="summary-card accent-blue">
          <span>涨超6%</span>
          <strong id="stock-count">--</strong>
          <small>用于板块概念统计</small>
        </article>
        <article class="summary-card accent-gold">
          <span>行业第一</span>
          <strong id="top-sector">--</strong>
          <small id="top-sector-count">等待数据</small>
        </article>
        <article class="summary-card accent-purple">
          <span>概念第一</span>
          <strong id="top-concept">--</strong>
          <small id="top-concept-count">等待数据</small>
        </article>
      </section>

      <section class="status-card">
        <div>
          <span class="status-label">数据状态</span>
          <strong id="status-text">正在读取最新复盘…</strong>
        </div>
        <a id="latest-link" class="text-button" href="./" hidden>返回最新</a>
      </section>

      <nav class="tabs" role="tablist" aria-label="复盘分类">
        <button type="button" role="tab" aria-selected="true" aria-controls="panel-results" id="tab-results">模型命中</button>
        <button type="button" role="tab" aria-selected="false" aria-controls="panel-industry" id="tab-industry">行业前10</button>
        <button type="button" role="tab" aria-selected="false" aria-controls="panel-concept" id="tab-concept">概念前10</button>
        <button type="button" role="tab" aria-selected="false" aria-controls="panel-history" id="tab-history">历史复盘</button>
      </nav>

      <div id="loading" class="loading">正在加载数据…</div>
      <div id="load-error" class="error-box" hidden></div>

      <section id="panel-results" class="panel" role="tabpanel" aria-labelledby="tab-results">
        <div class="panel-head">
          <div>
            <h2>模型命中股票</h2>
            <p>按60日强势次数、涨幅、量比排序</p>
          </div>
          <span id="result-count" class="count-pill">0只</span>
        </div>
        <label class="search-box">
          <span>搜索</span>
          <input id="stock-search" type="search" inputmode="search" placeholder="代码、名称、行业或概念">
        </label>
        <div id="stock-list" class="stock-list"></div>
        <div id="stock-empty" class="empty-state" hidden>没有匹配的股票</div>
      </section>

      <section id="panel-industry" class="panel" role="tabpanel" aria-labelledby="tab-industry" hidden>
        <div class="panel-head">
          <div>
            <h2>行业板块前10</h2>
            <p>同一只股票同一行业只计1次</p>
          </div>
        </div>
        <div id="industry-list" class="rank-list"></div>
      </section>

      <section id="panel-concept" class="panel" role="tabpanel" aria-labelledby="tab-concept" hidden>
        <div class="panel-head">
          <div>
            <h2>概念前10</h2>
            <p>同一只股票同一概念只计1次</p>
          </div>
        </div>
        <div id="concept-list" class="rank-list"></div>
      </section>

      <section id="panel-history" class="panel" role="tabpanel" aria-labelledby="tab-history" hidden>
        <div class="panel-head">
          <div>
            <h2>历史复盘</h2>
            <p>点击日期查看当天完整结果</p>
          </div>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>
    </main>

    <aside id="install-hint" class="install-hint" hidden>
      <button type="button" id="install-close" aria-label="关闭提示">×</button>
      <strong>添加到主屏幕</strong>
      <span>点 Safari 底部分享按钮，再选“添加到主屏幕”。</span>
    </aside>

    <footer>
      <span>数据仅供复盘，不构成投资建议</span>
      <span id="generated-at"></span>
    </footer>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
